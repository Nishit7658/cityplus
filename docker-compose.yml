version: '3.8'

# CityPulse 100% Free & Open-Source Municipal Operations Stack
# Vadodara Municipal Corporation (VMC) / Government of Gujarat

services:
  # 1. Open-Source PostgreSQL 16 with PostGIS 3.4 Spatial Extension
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: citypulse-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: citypulse
    ports:
      - "5432:5432"
    volumes:
      - citypulse-pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citypulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. CityPulse Backend API (Express.js + PostGIS Engine + Socket.IO)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citypulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/citypulse
      JWT_SECRET: vmc_production_jwt_secret_key_2026_free
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  # 3. CityPulse Frontend Web Console (Next.js SSR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citypulse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  citypulse-pgdata:
    driver: local
